name: virtuo

x-backend-image: &backend-image
  image: virtuo-backend:local
  build: ./backend

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: 5000
  DATABASE_URL: "postgresql://virtuo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/virtuo?schema=public&connection_limit=${DB_CONNECTION_LIMIT:-10}&pool_timeout=${DB_POOL_TIMEOUT:-10}&connect_timeout=5"
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  ALLOW_INITIAL_SETUP: ${ALLOW_INITIAL_SETUP:-false}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@virtuo.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  UPLOAD_DIR: /app/uploads
  TASK_LIST_LIMIT: ${TASK_LIST_LIMIT:-500}
  REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
  JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
  DB_TRANSACTION_MAX_WAIT_MS: ${DB_TRANSACTION_MAX_WAIT_MS:-5000}
  DB_TRANSACTION_TIMEOUT_MS: ${DB_TRANSACTION_TIMEOUT_MS:-15000}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
  SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
  SMTP_MAX_CONNECTIONS: ${SMTP_MAX_CONNECTIONS:-1}
  SMTP_MAX_MESSAGES_PER_CONNECTION: ${SMTP_MAX_MESSAGES_PER_CONNECTION:-50}
  SMTP_RATE_DELTA_MS: ${SMTP_RATE_DELTA_MS:-1000}
  SMTP_RATE_LIMIT: ${SMTP_RATE_LIMIT:-2}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: virtuo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: virtuo
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=${POSTGRES_SLOW_QUERY_MS:-500}
    ports:
      - "127.0.0.1:${POSTGRES_BIND_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtuo -d virtuo"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  migrate:
    image: virtuo-migrate:local
    build:
      context: ./backend
      target: migrator
    restart: "no"
    environment: *backend-environment
    command: ["sh", "-c", "./node_modules/.bin/prisma db push --skip-generate && node dist/bootstrap.js"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    <<: *backend-image
    restart: unless-stopped
    init: true
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "5000"
    networks:
      - private
      # Dalje e kontrolluar në internet për SMTP/DNS. Backend-i nuk publikon portë në këtë rrjet.
      - egress
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    stop_grace_period: 25s

  frontend:
    image: virtuo-frontend:local
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
      - private
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,nosuid,nodev
      - /var/run:size=8m,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

  backup:
    build: ./infrastructure/backup
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: virtuo
      PGUSER: virtuo
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - uploads_data:/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    stop_grace_period: 30s

  restore:
    build: ./infrastructure/backup
    profiles: ["restore"]
    restart: "no"
    entrypoint: ["/usr/local/bin/restore-backup"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: virtuo
      PGUSER: virtuo
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-NO}
    volumes:
      - ./backups:/backups:ro
      - uploads_data:/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private

volumes:
  postgres_data:
  uploads_data:

networks:
  public:
  private:
    internal: true
  egress:
